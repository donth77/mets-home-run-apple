[platformio]
default_envs = nano_esp32_usb_diagnostics

[env:nano_esp32_usb_diagnostics]
platform = platformio/espressif32@6.12.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<*>
  -<usb_smoke.cpp>
  -<display_test.cpp>
  -<live_display_usb.cpp>
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  ; Use the ESP32-S3 hardware USB CDC/JTAG interface for a reliable serial
  ; console after a DFU upload. PlatformIO's Nano manifest omits this choice.
  -DARDUINO_USB_MODE=1
build_src_flags =
  -Wall
  -Wextra
  -Werror

[env:nano_esp32_display_test]
; Use the same known-good Nano framework as the USB smoke target. Newer
; Arduino-ESP32 2.0.16+ builds have previously failed to start reliably on
; this physical board after DFU upload.
extends = env:nano_esp32_usb_smoke
build_src_filter =
  -<*>
  +<display_test.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

[env:nano_esp32_display_test_hwcdc]
; Debug variant of the display test on the ESP32-S3 hardware USB-Serial/JTAG
; console: boot messages and panic backtraces print without the TinyUSB task,
; so a crash is visible instead of wedging the board. Upload with a double-tap
; into the DFU bootloader (the 1200 bps touch needs the TinyUSB stack).
extends = env:nano_esp32_display_test
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:nano_esp32_live_display_usb]
; Prototype-only live display target. A host-side bridge polls MLB and sends a
; compact game snapshot over USB serial; motion remains fully disarmed.
extends = env:nano_esp32_usb_smoke
build_src_filter =
  -<*>
  +<live_display_usb.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

[env:nano_esp32_usb_smoke]
; Arduino-ESP32 2.0.14 is the last known-good Nano framework before a
; PlatformIO/Nano startup regression introduced in the 2.0.16 line.
platform = platformio/espressif32@6.6.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_src_filter =
  -<*>
  +<usb_smoke.cpp>
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  ; Match Arduino's default Nano ESP32 USB mode for the smallest possible
  ; framework-level USB and application-startup check.
  -DARDUINO_USB_MODE=0
build_src_flags =
  -Wall
  -Wextra
  -Werror
