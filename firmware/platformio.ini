[platformio]
default_envs = nano_esp32_usb_diagnostics

[env:nano_esp32_usb_diagnostics]
platform = platformio/espressif32@6.12.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<*>
  -<usb_smoke.cpp>
  -<display_test.cpp>
  -<live_display_usb.cpp>
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  ; Use the ESP32-S3 hardware USB CDC/JTAG interface for a reliable serial
  ; console after a DFU upload. PlatformIO's Nano manifest omits this choice.
  -DARDUINO_USB_MODE=1
build_src_flags =
  -Wall
  -Wextra
  -Werror

[env:nano_esp32_display_test]
; Use the same known-good Nano framework as the USB smoke target. Newer
; Arduino-ESP32 2.0.16+ builds have previously failed to start reliably on
; this physical board after DFU upload.
extends = env:nano_esp32_usb_smoke
build_src_filter =
  -<*>
  +<display_test.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

[env:nano_esp32_display_test_hwcdc]
; Debug variant of the display test on the ESP32-S3 hardware USB-Serial/JTAG
; console: boot messages and panic backtraces print without the TinyUSB task,
; so a crash is visible instead of wedging the board. Upload with a double-tap
; into the DFU bootloader (the 1200 bps touch needs the TinyUSB stack).
extends = env:nano_esp32_display_test
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:nano_esp32_live_display_usb]
; Prototype-only live display target. A host-side bridge polls MLB and sends a
; compact game snapshot over USB serial; motion remains fully disarmed.
extends = env:nano_esp32_usb_smoke
build_src_filter =
  -<*>
  +<live_display_usb.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

[env:nano_esp32_motor_logic_test]
; USB-only proof of the ENA/IN1/IN2 control path. The motor supply, outputs,
; and actuator must remain disconnected. Its automatic sequence returns all
; three logic pins LOW after each bounded intent.
extends = env:nano_esp32_display_test
build_src_filter =
  -<*>
  +<motor_logic_test.cpp>

[env:nano_esp32_actuator_jog_test]
; Local, physically attended commissioning target for an unloaded actuator.
; It boots disarmed, requires a short-lived serial arm session, caps every
; direction command at 200 ms, and always disables the bridge afterward.
extends = env:nano_esp32_display_test
build_src_filter =
  -<*>
  +<actuator_jog_test.cpp>

[env:nano_esp32_l298n_meter_test]
; Voltage measurement target for the L298N. The actuator stays disconnected
; for the no-load reading; a loaded reading needs an unloaded, mid-stroke,
; attended actuator. It keeps the guarded arm/auto-stop protocol but extends
; the output window to ten seconds so a handheld multimeter can settle.
extends = env:nano_esp32_actuator_jog_test
build_flags =
  ${env:nano_esp32_usb_smoke.build_flags}
  -DAPPLE_L298N_METER_TEST=1

[env:nano_esp32_motion_commissioning]
; Physically attended commissioning target that runs the real celebration
; engine against the timed actuator model with production lead-in, deadlines,
; and raised dwell. One arm authorizes one simulated Mets home run. Run it first
; with the actuator disconnected from OUT1/OUT2, then unloaded and attended.
extends = env:nano_esp32_display_test
build_src_filter =
  -<*>
  +<motion_commissioning_test.cpp>

[env:nano_esp32_motion_commissioning_ina219]
; Commissioning build with the INA219 current sensor spliced into the fused
; 12 V lead, I2C remapped to A6/A7. Confirms arrival when the motor current
; collapses at an end stop and latches a stall fault. Falls back to the timed
; drive when the sensor is absent, so the same build runs with or without it.
extends = env:nano_esp32_motion_commissioning
build_flags =
  ${env:nano_esp32_usb_smoke.build_flags}
  -DAPPLE_MOTION_CURRENT_SENSE=1
lib_deps =
  ${env:nano_esp32_display_test.lib_deps}
  adafruit/Adafruit INA219@1.2.3

[env:nano_esp32_audio_test]
; Track C bench diagnostic: microSD on the shared SPI bus with chip select A0
; and the MAX98357A I2S amplifier on A1/A2/A3. Motion pins stay low; keep the
; 12 V supply unplugged. Software gain starts at 10 % and is capped at 35 %.
extends = env:nano_esp32_display_test
build_src_filter =
  -<*>
  +<audio_test.cpp>
lib_deps =
  ${env:nano_esp32_display_test.lib_deps}
  earlephilhower/ESP8266Audio@1.9.9

[env:nano_esp32_apple]
; Autonomous target: joins Wi-Fi with the credentials in
; include/apple/firmware/secrets.local.hpp, polls the MLB Stats API over
; certificate-validated HTTPS, and runs the shared game-state, decision-core,
; and display code. Motion is a recording adapter here: the timed model runs
; and reports positions, but the L298N pins stay low. Serial `r` replays the
; recorded Mets at Rays game from fixtures/mlb without any network.
extends = env:nano_esp32_display_test
build_src_filter =
  -<*>
  +<apple_live.cpp>
lib_extra_dirs =
  third_party
; The Manager page and logo are real files under lib/manager/page; this
; regenerates their headers before each build.
extra_scripts =
  pre:tools/embed_page.py
build_flags =
  ${env:nano_esp32_usb_smoke.build_flags}
  -DAPPLE_LIVE_TARGET=1

[env:nano_esp32_apple_motion]
; Same target with the L298N driven by the timed actuator model, exactly as
; the motion commissioning build proved on the bench. Only flash this after
; the commissioning sequence has completed with the attached actuator, keep
; the fused 12 V supply switched, and unplug it before every flash.
extends = env:nano_esp32_apple
build_flags =
  ${env:nano_esp32_apple.build_flags}
  -DAPPLE_MOTION_DRIVE=1

[env:nano_esp32_usb_smoke]
; Arduino-ESP32 2.0.14 is the last known-good Nano framework before a
; PlatformIO/Nano startup regression introduced in the 2.0.16 line.
platform = platformio/espressif32@6.6.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_src_filter =
  -<*>
  +<usb_smoke.cpp>
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  ; Match Arduino's default Nano ESP32 USB mode for the smallest possible
  ; framework-level USB and application-startup check.
  -DARDUINO_USB_MODE=0
build_src_flags =
  -Wall
  -Wextra
  -Werror
