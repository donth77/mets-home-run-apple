<text class="body" x="60.0" y="734.0" text-anchor="start">Outside 81&#160;mm wide, 87&#160;mm front to back, 81&#160;mm tall. Walls 3&#160;mm, floor 4.5&#160;mm, inside 76.5&#160;mm deep. Open top.</text>
