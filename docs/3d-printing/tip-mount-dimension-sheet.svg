<text class="cap" x="985.0" y="495.6" text-anchor="middle">12&#160;mm post with four hooked snap arms</text>
<text class="cap" x="985.0" y="522.6" text-anchor="middle">Four spring fingers on the diagonals, each with a ridge</text>
<text class="cap" x="985.0" y="542.6" text-anchor="middle">Four small guide ribs around the outside</text>
<text class="cap" x="985.0" y="562.6" text-anchor="middle">Dashed lines show hidden edges</text>
<text class="cap" x="985.0" y="582.6" text-anchor="middle">The screw head faces the bottom of the page</text>
<path class="ext" d="M60 700H1140"/>
<text class="body" x="60.0" y="734.0" text-anchor="start">Body 25&#160;mm wide, 41.8&#160;mm tall. Fits the Apple's 26&#160;mm hole. Pocket 9.4&#160;mm wide for a 9&#160;mm rod tip with flats 6.5&#160;mm apart.</text>
<text class="body" x="60.0" y="756.0" text-anchor="start">M4 &#215; 20&#160;mm button-head screw and M4 lock nut. The pocket rests on the end of the tip; the nut pulls the tip's flat against the wall.</text>
<text class="body" x="60.0" y="778.0" text-anchor="start">Push on 14 to 18&#160;N (about 3 to 4 lb). Pull off 16 to 19&#160;N (about 4 lb). Calculated, not measured.</text>
<text class="body" x="60.0" y="800.0" text-anchor="start">Print in black nylon (SLS or MJF).</text>
<text class="cap" x="60.0" y="832.0" text-anchor="start">Design sizes. Printed parts land within 0.2 to 0.3&#160;mm of them.</text>
