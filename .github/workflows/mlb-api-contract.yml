name: MLB API contract

# The MLB Stats API is unofficial and changes without notice. This job pulls
# a recent Mets game through the same native feed adapter the physical Apple
# runs and the browser adapter Apple Lab and Virtual Apple use, so a breaking
# change shows up here first, as an issue opened in this repository (and
# closed again once the check passes), instead of on a game night. It runs
# weekly in season and monthly in the offseason, when the API tends to change
# ahead of the new year; the last completed game still exercises the parsers.

on:
  schedule:
    - cron: "15 13 * 3-10 1" # Mondays 09:15 New York, March through October
    - cron: "15 14 1 11,12,1,2 *" # the 1st of each offseason month, 09:15 New York standard time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the native feed adapter
        run: |
          cmake -S firmware -B .cache/native -DCMAKE_BUILD_TYPE=Release
          cmake --build .cache/native --parallel --target apple_mlb_feed_tests
      - name: Check the live API against the device and browser adapters
        run: python3 firmware/tools/mlb_contract_check.py --native .cache/native/test/native/apple_mlb_feed_tests --browser
      - name: Open an issue when the check fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label mlb-api --state open --json number --jq '.[0].number')
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing on $(date -u +%Y-%m-%d): $run_url"
          else
            gh label create mlb-api --description "MLB Stats API changed" --color d93f0b 2>/dev/null || true
            gh issue create --label mlb-api \
              --title "MLB API contract check failed on $(date -u +%Y-%m-%d)" \
              --body "The weekly check of the MLB Stats API against the device and browser feed adapters failed. Log: $run_url. Fix the adapters, then ship the firmware as a signed release so every Apple picks it up from the Manager."
          fi
      - name: Close the issue once the check passes again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label mlb-api --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The contract check passed again on $(date -u +%Y-%m-%d)."
          done
