    <style>
      html,
      body {
        background: #071728;
        margin: 0;
      }
      .app-shell-loader {
        align-items: center;
        background: radial-gradient(circle at 50% 44%, rgba(32, 87, 137, 0.5), transparent 35%), #071728;
        color: #f5f9fc;
        display: flex;
        flex-direction: column;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        inset: 0;
        justify-content: center;
        letter-spacing: 0.03em;
        position: fixed;
      }
      .app-shell-loader__spinner {
        animation: app-shell-loading-spin 0.85s linear infinite;
        border: 3px solid rgba(178, 209, 232, 0.2);
        border-radius: 50%;
        border-top-color: #f26a2d;
        height: 34px;
        margin-bottom: 13px;
        width: 34px;
      }
      .app-shell-loader strong {
        font-size: 0.82rem;
      }
      .app-shell-fallback {
        align-items: center;
        background: #081827;
        color: #f7fbff;
        display: flex;
        flex-direction: column;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        gap: 12px;
        justify-content: center;
        min-height: 100vh;
        padding: 32px;
        text-align: center;
      }
      .app-shell-fallback img {
        height: 88px;
        width: 88px;
      }
      .app-shell-fallback h1,
      .app-shell-fallback p {
        margin: 0;
      }
      .app-shell-fallback p {
        color: #cbd9e5;
        line-height: 1.6;
        max-width: 680px;
      }
      .app-shell-fallback a {
        color: #ffb17d;
        font-weight: 700;
      }
      @keyframes app-shell-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-shell-loader__spinner {
          animation: none;
          border-color: #f26a2d;
        }
      }
    </style>
    <noscript>
      <style>
        .app-shell-loader {
          display: none;
        }
      </style>
    </noscript>

    <title>Virtual Mets Apple</title>

  <body>
    <div id="root">
      <main class="app-shell-loader" role="status" aria-live="polite">
        <span class="app-shell-loader__spinner" aria-hidden="true"></span>
        <strong>Preparing Citi Field</strong>
      </main>
    </div>
    <noscript>
      <main class="app-shell-fallback">
        <img src="/favicon.png" alt="" width="88" height="88" />
        <h1>Virtual Mets Apple</h1>
        <p>
          Follow New York Mets games with live scores, a 3D Citi Field Home Run Apple, upcoming matchups, Mets Radio,
          and celebrations for home runs and wins.
        </p>
        <p>
          This is a free, unofficial fan-made experience. The interactive version needs JavaScript and WebGL.
          <a href="https://github.com/donth77/mets-home-run-apple">View the open-source project</a>.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
